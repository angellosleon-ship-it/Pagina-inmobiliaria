<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inmobiliaria One</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 20px;
}

header img {
    width: 150px;
}

section {
    padding: 40px 20px;
    text-align: center;
}

.project {
    background: white;
    margin: 30px auto;
    padding: 30px;
    border-radius: 10px;
    max-width: 900px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.project-logo {
    width: 180px;
    margin-bottom: 15px;
}

.media-preview img,
.media-preview video {
    max-width: 100%;
    margin-top: 15px;
    border-radius: 8px;
}

.upload-box {
    margin-top: 20px;
    padding: 20px;
    border: 2px dashed #ccc;
    border-radius: 10px;
}

button {
    background: #c59d5f;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #a87d3d;
}
</style>
</head>

<body>

<header>
    <img src="hl_logo.png" alt="Logo Inmobiliaria">
    <h1>Tu futuro hogar te espera</h1>
</header>

<!-- FUNDO MALABRIGO -->
<section class="project">
    <img src="logo-fundo-malabrigo.png" alt="Proyecto Fundo Malabrigo Chepén" class="project-logo">
    <h2>Fundo Malabrigo</h2>
    <p>Ubicación estratégica y alta valorización.</p>

    <div class="upload-box">
        <h3>Subir fotos o videos</h3>
        <input type="file" accept="image/*,video/*" onchange="previewMedia(event, 'preview1')" multiple>
        <div id="preview1" class="media-preview"></div>
    </div>
</section>

<!-- PUERTO MAR -->
<section class="project">
    <img src="logo-puerto-mar.png" alt="Proyecto Puerto Mar Paiján" class="project-logo">
    <h2>Puerto Mar</h2>
    <p>Lotes cerca al mar con excelente proyección.</p>

    <div class="upload-box">
        <h3>Subir fotos o videos</h3>
        <input type="file" accept="image/*,video/*" onchange="previewMedia(event, 'preview2')" multiple>
        <div id="preview2" class="media-preview"></div>
    </div>
</section>

<!-- MONTE VERDE -->
<section class="project">
    <img src="logo-monte-verde.png" alt="Proyecto Monte Verde" class="project-logo">
    <h2>Monte Verde</h2>
    <p>Conexión con la naturaleza y tranquilidad.</p>

    <div class="upload-box">
        <h3>Subir fotos o videos</h3>
        <input type="file" accept="image/*,video/*" onchange="previewMedia(event, 'preview3')" multiple>
        <div id="preview3" class="media-preview"></div>
    </div>
</section>

<script>
function previewMedia(event, previewId) {
    const files = event.target.files;
    const preview = document.getElementById(previewId);
    preview.innerHTML = "";

    for (let file of files) {
        const reader = new FileReader();

        reader.onload = function(e) {
            if (file.type.startsWith("image")) {
                const img = document.createElement("img");
                img.src = e.target.result;
                preview.appendChild(img);
            } 
            else if (file.type.startsWith("video")) {
                const video = document.createElement("video");
                video.src = e.target.result;
                video.controls = true;
                preview.appendChild(video);
            }
        }

        reader.readAsDataURL(file);
    }
}
</script>

</body>
</html>
