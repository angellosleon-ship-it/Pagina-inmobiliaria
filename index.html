<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Humberto León | Inversión Inmobiliaria 2026</title>

<style>
:root {
    --dorado: #bfa046;
    --dorado-brillante: #ffcc33;
    --oscuro-deep: #020617;
    --oscuro-card: linear-gradient(145deg, #1e293b, #0f172a);
    --verde-wa: #25D366;
}
body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--oscuro-deep); color: white; scroll-behavior: smooth; }

/* HEADER */
header { position: relative; height: 60vh; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; }
.overlay { position: absolute; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1; }
.header-content { position: relative; z-index: 2; padding: 20px; }
.logo-personal { width: 180px; filter: drop-shadow(0 0 15px var(--dorado)); }
h1 { font-size: 2.5rem; margin: 10px 0; color: var(--dorado); }

/* PROYECTOS */
.proyectos { padding: 40px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: auto; }
.proyecto-card { background: var(--oscuro-card); border: 1px solid rgba(191,160,70,0.3); border-radius: 20px; padding: 25px; text-align: center; }

/* SUBTÍTULOS DORADOS (Tu pedido) */
.tag-dorado { color: var(--dorado-brillante); font-weight: 900; text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 10px; }

.btn { display: inline-block; padding: 12px 20px; background: linear-gradient(to bottom, #bfa046, #8a6d1d); color: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; margin: 5px; text-decoration: none; }
.btn-agendar { background: #25D366; }

/* BOTÓN CLIENTES FELICES (Súper vistoso) */
.btn-clientes-pro {
    background: linear-gradient(45deg, #bfa046, #ffcc33, #bfa046);
    background-size: 200% auto;
    border: none; border-radius: 50px; padding: 20px 40px; color: #000; font-weight: 900; font-size: 1.2rem;
    cursor: pointer; box-shadow: 0 0 20px rgba(255, 204, 51, 0.5); animation: pulse 2s infinite; margin: 40px auto; display: block;
}

@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

/* LIGHTBOX (Para las fotos) */
#lightbox { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
#lightbox img { max-width: 90%; max-height: 70%; border: 3px solid var(--dorado); border-radius: 10px; }

/* VIDEO CONTAINER */
.video-area { margin-top: 15px; border-radius: 15px; overflow: hidden; }

.wa-float { position: fixed; bottom: 20px; right: 20px; background: var(--verde-wa); width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
</style>
</head>
<body>

<header>
    <div class="overlay"></div>
    <div class="header-content">
        <img src="hl_logo.png" class="logo-personal" alt="Humberto León">
        <h1>Humberto León</h1>
        <p style="color: #ccc; letter-spacing: 3px;">JEFE COMERCIAL</p>
    </div>
</header>

<section class="proyectos">
    <div class="proyecto-card">
        <span class="tag-dorado">Campo & Mar</span>
        <img src="logo-fundo.png" style="width:100px; margin-bottom:15px;">
        <h3>FUNDO MALABRIGO</h3>
        <p class="tag-dorado" style="font-size: 0.9rem;">📍 PUERTO MALABRIGO</p>
        <button class="btn" onclick="abrirGaleria(['fundo1.jpg','fundo2.jpg','fundo3.jpg'])">VER FOTOS</button>
        <button class="btn" onclick="verVideo('vid1', '1UrsaiKqm_dyl1F8qtVkwD9UH7_QnxfoU')">VER VIDEO</button>
        <div id="vid1" class="video-area"></div>
    </div>

    <div class="proyecto-card">
        <span class="tag-dorado">Frente al Mar</span>
        <img src="logo-puerto.png" style="width:100px; margin-bottom:15px;">
        <h3>PUERTO MAR CLUB</h3>
        <p class="tag-dorado" style="font-size: 0.9rem;">📍 7 MINUTOS DE LA PLAYA</p>
        <button class="btn" onclick="abrirGaleria(['puerto1.jpg','puerto2.jpg'])">VER FOTOS</button>
        <button class="btn" onclick="verVideo('vid2', '1KmYsCcxL0D57Nb_zq9yJ1OWgnL0RL9uE')">VER VIDEO</button>
        <div id="vid2" class="video-area"></div>
    </div>
</section>

<button class="btn-clientes-pro" onclick="abrirGaleria(['cliente1.jpg','cliente2.jpg','cliente3.jpg'])">🤝 CLIENTES FELICES</button>

<a href="https://wa.me/51985877256" class="wa-float" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="35">
</a>

<div id="lightbox">
    <img id="img-grande" src="">
    <div style="margin-top: 20px;">
        <button class="btn" onclick="cerrarLightbox()" style="background: #ff4444;">CERRAR</button>
    </div>
</div>

<script>
// Función para Fotos
function abrirGaleria(fotos) {
    if(fotos.length > 0) {
        document.getElementById('img-grande').src = fotos[0];
        document.getElementById('lightbox').style.display = 'flex';
    }
}

function cerrarLightbox() {
    document.getElementById('lightbox').style.display = 'none';
}

// Función para Videos (Google Drive)
function verVideo(divId, videoId) {
    const contenedor = document.getElementById(divId);
    if(contenedor.innerHTML === "") {
        contenedor.innerHTML = `<iframe src="https://drive.google.com/file/d/${videoId}/preview" width="100%" height="250" frameborder="0" allow="autoplay"></iframe>`;
    } else {
        contenedor.innerHTML = ""; // Si le da clic de nuevo, se cierra
    }
}
</script>

</body>
</html>
