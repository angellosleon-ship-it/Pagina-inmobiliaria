<style>
body{

 color:white;
}
header{
 position:relative;
 height:100vh;
 overflow:hidden;
}

 object-fit:cover;
 z-index:-1;
}
.overlay{

 height:100%;
 background:rgba(0,0,0,0.7);
}
.header-content{

 text-align:center;
 top:50%;
 transform:translateY(-50%);
}
.header-content img{

 margin-bottom:20px;
}
.header-content h1{
 font-size:64px;
 font-weight:bold;
 background: linear-gradient(45deg,#bfa046,#d4b75a);
 -webkit-background-clip:text;
 -webkit-text-fill-color:transparent;
}
.header-content p{

 color:#d4b75a;
 font-weight:bold;
}
.proyectos{
 padding:100px 20px;
 text-align:center;
}
.proyectos h2{

 background: linear-gradient(90deg, #bfa046, #d4b75a);
 -webkit-background-clip: text;
 -webkit-text-fill-color: transparent;

}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
 gap:40px;

}
.proyecto-card{

 border-radius:25px;
 padding:25px;
 box-shadow:0 20px 60px rgba(0,0,0,0.7);

}
.proyecto-card:hover{
 transform:translateY(-10px);
}
.logo-proyecto{
 width:140px;
 margin:0 auto 15px;
 display:block;
}
.subtitulo-proyecto{
 font-size:16px;
 color:#bfa046;
 margin-bottom:15px;
}
.botones-proyecto{
 margin-top:15px;
}
.btn{
 display:inline-block;
 padding:10px 18px;
 margin:5px;
 background:#bfa046;
 color:white;
 text-decoration:none;
 border-radius:30px;
 transition:0.3s;
}
.btn:hover{
 background:#d4b75a;
}
.btn-agendar{
 background:#25D366;
}
.video-container iframe{
 width:100%;
 height:400px;
 border-radius:15px;
}
.cuestionario{
 background:#0b1220;
 padding:100px 20px;
 text-align:center;
}
form{

input, select, textarea{

}

<body>

<header>
<video autoplay muted loop>
<source src="header-video.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
<div class="header-content">
<img src="hl_logo.png" alt="Humberto León">
<h1>Humberto León</h1>
<p>Asesor Inmobiliario</p>
<p>Invierte hoy en tu futuro hogar</p>
</div>
</header>

<section class="proyectos">
<h2>Proyectos Destacados</h2>
<div class="grid">

<div class="proyecto-card">
<img src="logo-fundo.png" class="logo-proyecto">
<h3>Fundo Malabrigo</h3>
<p class="subtitulo-proyecto">Compra tu lote cerca del mar</p>
<div class="botones-proyecto">
<a href="javascript:void(0)" class="btn" onclick="abrirImagenes(['fundo1.jpg','fundo2.jpg','fundo3.jpg'])">Ver Fotos</a>
<a href="javascript:void(0)" class="btn" onclick="mostrarVideos('fundo-videos',['1ag0ZNVmKD6VA_TBOrhmOCrKsdaAqb9Vj'])">Ver Videos</a>
<a href="https://wa.me/51985877256" target="_blank" class="btn btn-agendar">Agendar Visita</a>
</div>
<div id="fundo-videos" class="video-container"></div>
</div>

</div>
</section>

<div id="lightbox">
<img id="lightbox-img">
<div id="lightbox-controls">
<button onclick="prevImg()">Anterior</button>
<button onclick="nextImg()">Siguiente</button>
<button onclick="cerrar()">Cerrar</button>
</div>
</div>

<section class="cuestionario">
<h2>Solicita Información</h2>
<form id="formulario">
<input type="text" id="nombre" placeholder="Nombre completo" required>
<input type="tel" id="telefono" placeholder="Número de celular" required>
<textarea id="mensaje" placeholder="Escribe tu consulta"></textarea>
<button type="submit">Enviar por WhatsApp</button>
</form>
</section>

<footer>
© 2026 Humberto León | Asesor Inmobiliario
</footer>

<script>
let imagenes=[];
let index=0;

function abrirImagenes(arr){
imagenes=arr;
index=0;
document.getElementById("lightbox-img").src=imagenes[index];
document.getElementById("lightbox").style.display="flex";
}

function prevImg(){
index=(index-1+imagenes.length)%imagenes.length;
document.getElementById("lightbox-img").src=imagenes[index];
}

function nextImg(){
index=(index+1)%imagenes.length;
document.getElementById("lightbox-img").src=imagenes[index];
}

function cerrar(){
document.getElementById("lightbox").style.display="none";
}

function mostrarVideos(containerId,fileIds){
const container=document.getElementById(containerId);
container.innerHTML="";
fileIds.forEach(id=>{
const iframe=document.createElement("iframe");
iframe.src=`https://drive.google.com/file/d/${id}/preview`;
iframe.allow="autoplay";
container.appendChild(iframe);
});
}

document.getElementById("formulario").addEventListener("submit",function(e){
e.preventDefault();
let nombre=document.getElementById("nombre").value;
let telefono=document.getElementById("telefono").value;
let mensaje=document.getElementById("mensaje").value;
let texto=`Hola Humberto, quiero información.\n\nNombre: ${nombre}\nTeléfono: ${telefono}\nMensaje: ${mensaje}`;
window.open(`https://wa.me/51985877256?text=${encodeURIComponent(texto)}`,"_blank");
});
</script>

</body>
</html>
