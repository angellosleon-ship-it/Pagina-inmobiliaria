<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humberto León</title>

<style>
:root {
    --dorado: #bfa046;
    --dorado-brillante: #ffcc33;
    --oscuro-deep: #020617;
    --oscuro-card: linear-gradient(145deg, #1e293b, #0f172a);
    --verde-wa: #25D366;
}

body {
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:var(--oscuro-deep);
    color:white;
    scroll-behavior:smooth;
}

/* HEADER */
header {
    position: relative;
    min-height: 65vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('fondo.jpg') center/cover no-repeat;
}

#contenedor-principal {
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:30px;
    text-align:center;
    transition:0.6s;
    width:100%;
    max-width:1000px;
    margin:auto;
}

/* BOTÓN CLIENTES */
.btn-clientes {
    background: linear-gradient(45deg, #bfa046, #ffcc33);
    color: #000;
    border: none;
    padding: 14px 28px;
    font-size: 1rem;
    font-weight: 800;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(191,160,70,0.5);
    transition: all 0.3s ease;
    animation: pulso 2s infinite;
}

.btn-clientes:hover {
    animation: none;
    transform: scale(1.08);
    background: linear-gradient(45deg, #ffcc33, #fff);
}

@keyframes pulso {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

/* PROYECTOS */
.proyectos { padding:80px 20px; text-align:center; }

.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:40px;
    max-width:1250px;
    margin:auto;
}

.proyecto-card {
    background:var(--oscuro-card);
    border:1px solid rgba(191,160,70,0.3);
    border-radius:30px;
    padding:35px;
    transition:0.5s all ease;
}

.proyecto-card:hover {
    transform:translateY(-15px);
    border-color:var(--dorado-brillante);
}

/* FAQ */
.faq-question {
    color:var(--dorado-brillante);
    cursor:pointer;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
}

.faq-answer {
    display:none;
    color:#ccc;
    margin-top:10px;
    line-height:1.6;
}

/* WHATSAPP */
.wa-float {
    position:fixed;
    bottom:30px;
    right:30px;
    background:var(--verde-wa);
    width:65px;
    height:65px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

/* RESPONSIVE */
@media (max-width:768px) {
    .grid { grid-template-columns:1fr; gap:30px; }
}
</style>
</head>

<body>

<header>
<div id="contenedor-principal">

    <div>
        <img src="hl_logo.png" onclick="toggleHeader()" style="width:190px; cursor:pointer;">
        <h1>Humberto León</h1>
        <p>Asesor Inmobiliario</p>
    </div>

    <div id="info-humberto" style="opacity:0; transform:translateY(30px); pointer-events:none;">
        <h3>Jefe Comercial</h3>
        <p>Asesoría inmobiliaria segura y confiable.</p>
    </div>

</div>
</header>

<!-- CLIENTES -->
<section style="text-align:center; padding:60px 20px;">
    <h2>CONFIANZA REAL</h2>

    <button class="btn-clientes"
    onclick="abrirImagenes(['cliente1.jpg','cliente2.jpg','cliente3.jpg','cliente4.jpg','cliente5.jpg'])">
    🤝 Ver Clientes Reales
    </button>

    <p style="color:#ffcc33;">Fotos reales de firmas y entregas</p>
</section>

<!-- PROYECTOS -->
<section class="proyectos">
<h2>Nuestros Proyectos</h2>
<div class="grid">

    <div class="proyecto-card">
        <h3>Fundo Malabrigo</h3>
        <button onclick="toggleProyecto('info-fundo')">Ver</button>

        <div id="info-fundo" style="display:none;">
            <p>Proyecto de campo</p>
        </div>
    </div>

</div>
</section>

<!-- FAQ -->
<section>
<div class="faq-question" onclick="toggleFaq(this)">Pregunta 1</div>
<div class="faq-answer">Respuesta 1</div>
</section>

<!-- WHATSAPP -->
<a class="wa-float" href="https://wa.me/51985877256" target="_blank">
    WA
</a>

<script>
let headerActivo = false;

function toggleHeader() {
    const contenedor = document.getElementById("contenedor-principal");
    const mensaje = document.getElementById("info-humberto");

    if (!headerActivo) {
        contenedor.style.flexDirection = "row";
        mensaje.style.opacity = "1";
        mensaje.style.pointerEvents = "auto";
        headerActivo = true;
    } else {
        contenedor.style.flexDirection = "column";
        mensaje.style.opacity = "0";
        mensaje.style.pointerEvents = "none";
        headerActivo = false;
    }
}

function toggleProyecto(id) {
    const el = document.getElementById(id);
    el.style.display = (el.style.display === "block") ? "none" : "block";
}

function toggleFaq(el) {
    const answer = el.nextElementSibling;
    answer.style.display = (answer.style.display === "block") ? "none" : "block";
}

function abrirImagenes(imgs){
    alert("Lightbox funcionando con " + imgs.length + " imágenes");
}
</script>

</body>
</html>
