<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humberto León</title>

<link rel="stylesheet" href="estilos.css">

</head>
<body>

<!-- BOTÓN WHATSAPP -->
<a href="https://wa.me/51985877256" class="wa-float" target="_blank">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="38">
</a>

<!-- HEADER -->
<header>
<video autoplay muted loop>
<source src="https://drive.google.com/uc?export=download&id=1UrsaiKqm_dyl1F8qtVkwD9UH7_QnxfoU">
</video>

<div class="overlay"></div>

<div id="contenedor-principal">

<div>
<img src="hl_logo.png" class="mi-logo" onclick="toggleHeader()">

<h1 style="font-size:3rem;
background:linear-gradient(45deg,#bfa046,#ffcc33,#fff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;">
Humberto León
</h1>

<p style="color:#ffcc33; font-weight:700;">
Asesor Inmobiliario · Inversión Segura
</p>
</div>

<div id="info-humberto">
<h3 style="color:#ffcc33;">Jefe Comercial</h3>
<p>
Hola, soy Humberto León. Te ayudo a invertir seguro con respaldo legal.
</p>
</div>

</div>
</header>

<!-- BOTONES IZQUIERDA -->
<div class="menu-proyectos">
<button onclick="abrirProyecto('fundo')">Fundo Malabrigo</button>
<button onclick="abrirProyecto('puerto')">Puerto Mar Club</button>
<button onclick="abrirProyecto('monte')">Monte Verde</button>
<button onclick="abrirProyecto('clientes')">Clientes</button>
</div>

<!-- PANEL DERECHO -->
<div id="panel" class="panel-proyecto"></div>

<!-- FAQ -->
<section style="padding:60px 20px;">
<h2 style="text-align:center;">Preguntas Frecuentes</h2>

<div>
<div class="faq-question" onclick="toggleFaq(this)">¿Es seguro?</div>
<div class="faq-answer">Sí, todo está en regla.</div>
</div>

<div>
<div class="faq-question" onclick="toggleFaq(this)">¿Hay financiamiento?</div>
<div class="faq-answer">Sí, directo.</div>
</div>

</section>

<script>

/* HEADER */
function toggleHeader(){
document.getElementById("contenedor-principal").classList.toggle("activo");
}

/* PANEL PROYECTOS */
function abrirProyecto(tipo){
const panel = document.getElementById("panel");

let contenido = "";

if(tipo === "fundo"){
contenido = `
<h2>Fundo Malabrigo</h2>
<p>Lotes de campo y playa</p>
<button class="btn" onclick="abrirImagenes(['fundo1.jpg','fundo2.jpg'])">Fotos</button>
`;
}

if(tipo === "puerto"){
contenido = `
<h2>Puerto Mar Club</h2>
<p>Frente al mar</p>
<button class="btn" onclick="abrirImagenes(['puerto1.jpg','puerto2.jpg'])">Fotos</button>
`;
}

if(tipo === "monte"){
contenido = `
<h2>Monte Verde</h2>
<p>Alta plusvalía</p>
<button class="btn" onclick="abrirImagenes(['monte1.jpg'])">Fotos</button>
`;
}

if(tipo === "clientes"){
contenido = `
<h2>Clientes Felices</h2>
<button class="btn" onclick="abrirImagenes(['cliente1.jpg'])">Ver</button>
`;
}

panel.innerHTML = contenido;
panel.classList.add("activo");
}

/* FAQ */
function toggleFaq(el){
let a = el.nextElementSibling;
a.style.display = a.style.display === "block" ? "none" : "block";
}

/* IMÁGENES */
let imgs = [];
let idx = 0;

function abrirImagenes(arr){
imgs = arr;
alert("Aquí se abrirían tus imágenes reales");
}

</script>

</body>
</html>
