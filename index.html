<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humberto León</title>

<link rel="stylesheet" href="estilos.css">
</head>

<body>

<!-- WHATSAPP -->
<a href="https://wa.me/51985877256" class="wa-float" target="_blank">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="35">
</a>

<!-- HEADER -->
<header>

<video autoplay muted loop>
<source src="https://drive.google.com/uc?export=download&id=1UrsaiKqm_dyl1F8qtVkwD9UH7_QnxfoU">
</video>

<div class="overlay"></div>

<div id="contenedor-principal">

<div>
<img src="hl_logo.png" class="mi-logo" onclick="toggleHeader()">

<h1 style="background:linear-gradient(45deg,#bfa046,#fff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;">
Humberto León
</h1>

<p>Asesor Inmobiliario</p>
</div>

<div id="info-humberto">
<h3>Jefe Comercial</h3>
<p>Te ayudo a invertir con seguridad y alta rentabilidad.</p>
</div>

</div>
</header>

<!-- MENU IZQUIERDO -->
<div class="menu-proyectos">
<button class="btn-menu" onclick="mostrarPanel('fundo')">Fundo</button>
<button class="btn-menu" onclick="mostrarPanel('puerto')">Puerto</button>
<button class="btn-menu" onclick="mostrarPanel('monte')">Monte Verde</button>
<button class="btn-menu" onclick="mostrarPanel('clientes')">Clientes</button>
</div>

<!-- PANELES -->
<section id="fundo" class="panel">
<h2>Fundo Malabrigo</h2>
<button class="btn" onclick="abrirImagenes(['fundo1.jpg','fundo2.jpg'])">Fotos</button>
</section>

<section id="puerto" class="panel">
<h2>Puerto Mar Club</h2>
<button class="btn" onclick="abrirImagenes(['puerto1.jpg','puerto2.jpg'])">Fotos</button>
</section>

<section id="monte" class="panel">
<h2>Monte Verde</h2>
<button class="btn" onclick="abrirImagenes(['monte1.jpg','monte2.jpg'])">Fotos</button>
</section>

<section id="clientes" class="panel">
<h2>Clientes Felices</h2>
<button class="btn" onclick="abrirImagenes(['cliente1.jpg','cliente2.jpg'])">Ver</button>
</section>

<!-- FAQ -->
<section style="padding:40px;">
<h2>Preguntas Frecuentes</h2>

<div class="faq-question" onclick="toggleFaq(this)">¿Tiene documentos?</div>
<div class="faq-answer">Sí, todo en regla.</div>

<div class="faq-question" onclick="toggleFaq(this)">¿Hay financiamiento?</div>
<div class="faq-answer">Sí, directo.</div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; justify-content:center; align-items:center;">
<img id="img-lb" style="max-width:90%;">
</div>

<script>
let activo=false;

function toggleHeader(){
let c=document.getElementById("contenedor-principal");
c.classList.toggle("activo");
}

/* CAMBIAR PROYECTOS */
function mostrarPanel(id){
document.querySelectorAll(".panel").forEach(p=>p.classList.remove("activo"));
document.getElementById(id).classList.add("activo");
}

/* FAQ */
function toggleFaq(el){
let r=el.nextElementSibling;
r.style.display=r.style.display==="block"?"none":"block";
}

/* IMAGENES */
function abrirImagenes(arr){
document.getElementById("lightbox").style.display="flex";
document.getElementById("img-lb").src=arr[0];
}
</script>

</body>
</html>
