<style>

                 0 0 20px rgba(191, 160, 70, 0.6);

<body>

<!-- TODO TU CONTENIDO ORIGINAL EXACTAMENTE IGUAL -->

<script>
document.addEventListener("DOMContentLoaded", function(){

let lbImgs = [];
let cIdx = 0;

window.abrirImagenes = function(imgs){
    lbImgs = imgs;
    cIdx = 0;
    document.getElementById("lightbox-img").src = lbImgs[0];
    document.getElementById("lightbox").style.display = "flex";
}

window.cambiarImg = function(d){
    cIdx = (cIdx + d + lbImgs.length) % lbImgs.length;
    document.getElementById("lightbox-img").src = lbImgs[cIdx];
}

window.mostrarVideos = function(id, ids){
    const c = document.getElementById(id);
    c.innerHTML = "";
    ids.forEach(i => {
        let f = document.createElement("iframe");
        f.src = `https://drive.google.com/file/d/${i}/preview`;
        f.allow = "autoplay";
        f.frameBorder = "0";
        f.allowFullscreen = true;
        c.appendChild(f);
    });
}

window.toggleFaq = function(el){
    const answer = el.nextElementSibling;
    answer.style.display = (answer.style.display === "block") ? "none" : "block";
}

const form = document.getElementById("formulario");
if(form){
    form.addEventListener("submit", function(e){
        e.preventDefault();
        let n = document.getElementById("nombre").value;
        let p = document.getElementById("proyecto").value;

        window.open(`https://wa.me/51985877256?text=Hola%20Humberto,%20soy%20${n}.%20Me%20interesa%20invertir%20en%20${p}.`, "_blank");
    });
}

});
</script>

</body>
</html>
