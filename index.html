<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humberto León</title>

<link rel="stylesheet" href="estilos.css">
</head>

<body>

<!-- BOTÓN WHATSAPP -->
<a href="https://wa.me/51985877256" class="wa-float" target="_blank">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="35">
</a>

<!-- HEADER -->
<header>
<video autoplay muted loop>
<source src="https://drive.google.com/uc?export=download&id=1UrsaiKqm_dyl1F8qtVkwD9UH7_QnxfoU">
</video>

<div class="overlay"></div>

<div id="contenedor-principal">

<div>
<img src="hl_logo.png" class="mi-logo" onclick="toggleHeader()">

<h1 style="background:linear-gradient(45deg,#bfa046,#ffcc33,#fff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;">
Humberto León
</h1>

<p style="color:#ffcc33;">Asesor Inmobiliario</p>
</div>

<div id="info-humberto">
<h3 style="color:#ffcc33;">Jefe Comercial</h3>
<p>
Hola, soy Humberto León. Te ayudo a invertir con seguridad.
</p>
</div>

</div>
</header>

<!-- MENU IZQUIERDO -->
<div class="menu-proyectos">
<button onclick="abrirProyecto('fundo')">Fundo Malabrigo</button>
<button onclick="abrirProyecto('puerto')">Puerto Mar Club</button>
<button onclick="abrirProyecto('monte')">Monte Verde</button>
<button onclick="abrirProyecto('clientes')">Clientes</button>
</div>

<!-- PROYECTOS -->
<div id="fundo" class="panel">
<h2>Fundo Malabrigo</h2>
<button class="btn" onclick="abrirImagenes(['fundo1.jpg','fundo2.jpg'])">Fotos</button>
<button class="btn">Videos</button>
</div>

<div id="puerto" class="panel">
<h2>Puerto Mar Club</h2>
<button class="btn">Fotos</button>
<button class="btn">Videos</button>
</div>

<div id="monte" class="panel">
<h2>Monte Verde</h2>
<button class="btn">Fotos</button>
<button class="btn">Videos</button>
</div>

<div id="clientes" class="panel">
<h2>Clientes Felices</h2>
<button class="btn" onclick="abrirImagenes(['cliente1.jpg','cliente2.jpg'])">Ver</button>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" style="display:none;position:fixed;width:100%;height:100%;background:black;top:0;left:0;justify-content:center;align-items:center;">
<img id="imgbox" style="max-width:90%;">
</div>

<script>

/* HEADER */
function toggleHeader(){
document.getElementById("contenedor-principal").classList.toggle("activo");
}

/* PROYECTOS (SOLO UNO ABIERTO) */
function abrirProyecto(id){
let paneles = document.querySelectorAll(".panel");

paneles.forEach(p => p.style.display="none");

document.getElementById(id).style.display="block";
}

/* IMÁGENES */
function abrirImagenes(arr){
let box = document.getElementById("lightbox");
let img = document.getElementById("imgbox");

img.src = arr[0];
box.style.display="flex";

box.onclick = ()=> box.style.display="none";
}

</script>

</body>
</html>
