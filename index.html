<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humberto León</title>

<style>
:root {
    --dorado:#bfa046;
    --dorado-brillante:#ffcc33;
    --oscuro-deep:#020617;
    --oscuro-card:#1e293b;
    --verde-wa:#25D366;
}

body {
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:var(--oscuro-deep);
    color:white;
}

/* BOTÓN CLIENTES (CORREGIDO SOLO UNA VEZ) */
.btn-clientes {
    background: linear-gradient(45deg, #bfa046, #ffcc33);
    color:#000;
    border:none;
    padding:14px 28px;
    font-size:1rem;
    font-weight:800;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(191,160,70,0.5);
    animation:pulso 2s infinite;
    transition:0.3s;
}

.btn-clientes:hover {
    animation:none;
    transform:scale(1.08);
    background:linear-gradient(45deg,#ffcc33,#fff);
}

@keyframes pulso {
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}
</style>

</head>

<body>

<header style="position: relative; min-height: 65vh; display: flex; align-items: center; justify-content: center; overflow: hidden; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('fondo.jpg') center/cover no-repeat;">

<div id="contenedor-principal" style="display:flex; align-items:center; justify-content:center; flex-direction:column; gap:30px; text-align:center; width:100%; max-width:1000px; margin:auto;">

    <div id="bloque-logo">

        <img src="hl_logo.png" onclick="toggleHeader()" 
        style="cursor:pointer; width:190px; border-radius:12px; border:3px solid #bfa046;">

        <h1 style="margin:10px 0 0; font-size:3rem; font-weight:900;
        background:linear-gradient(45deg,#bfa046,#ffcc33,#fff);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;">
            Humberto León
        </h1>

        <p style="margin:8px 0 0;font-size:1.1rem;">
            Asesor Inmobiliario
        </p>

    </div>

    <div id="info-humberto" style="display:none; max-width:480px;">
        <h3 style="color:#ffcc33;">Asesor Inmobiliario</h3>
        <p>Te acompaño en todo el proceso de inversión segura.</p>
    </div>

</div>
</header>
<section class="proyectos">

<div class="grid">

<div class="proyecto-card">
    <h3>Fundo Malabrigo</h3>
    <img src="logo-fundo.png" width="120">

    <div>
        <button class="btn" onclick="abrirImagenes(['fundo1.jpg','fundo2.jpg'])">FOTOS</button>
    </div>
</div>

<div class="proyecto-card">
    <h3>Puerto Mar Club</h3>
    <img src="logo-puerto.png" width="120">

    <div>
        <button class="btn" onclick="abrirImagenes(['puerto1.jpg','puerto2.jpg'])">FOTOS</button>
    </div>
</div>

<div class="proyecto-card">
    <h3>Monte Verde</h3>
    <img src="logo-monte.png" width="120">

    <div>
        <button class="btn" onclick="abrirImagenes(['monte1.jpg','monte2.jpg'])">FOTOS</button>
    </div>
</div>

</div>
</section>

<!-- CLIENTES -->
<section class="clientes-section" style="text-align:center; padding:60px 20px;">

<h2>CONFIANZA REAL</h2>

<button type="button" class="btn-clientes"
onclick="abrirImagenes(['cliente1.jpg','cliente2.jpg','cliente3.jpg','cliente4.jpg','cliente5.jpg','cliente6.jpg','cliente7.jpg','cliente8.jpg','cliente9.jpg','cliente10.jpg'])">
🤝 Ver Clientes Reales
</button>

<p style="margin-top:20px;color:#ffcc33;font-weight:bold;">
(Fotos reales de firmas y entregas)
</p>

</section>

<!-- SCRIPT ÚNICO (CORREGIDO) -->
<script>

let headerActivo = false;

/* HEADER */
function toggleHeader() {
    const contenedor = document.getElementById("contenedor-principal");
    const info = document.getElementById("info-humberto");

    if (!headerActivo) {
        contenedor.style.flexDirection = "row";
        info.style.display = "block";
        headerActivo = true;
    } else {
        contenedor.style.flexDirection = "column";
        info.style.display = "none";
        headerActivo = false;
    }
}

/* IMÁGENES */
function abrirImagenes(imgs){
    alert("Abrir imágenes: " + imgs.join(", "));
}

/* PROYECTOS */
function toggleProyecto(id){
    const el = document.getElementById(id);
    el.style.display = (el.style.display === "block") ? "none" : "block";
}

</script>

</body>
</html>
