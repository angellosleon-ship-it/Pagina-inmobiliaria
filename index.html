    function mostrarVideos(id, ids){
        const c = document.getElementById(id);
        c.innerHTML = "";
        ids.forEach(i => {
            let f = document.createElement("iframe");
            f.src = `https://drive.google.com/file/d/${i}/preview`;
            f.allow = "autoplay"; f.frameBorder = "0"; f.allowFullscreen = true; f.loading = "lazy";
            c.appendChild(f);
        });
    }

        const answer = el.nextElementSibling;
        answer.style.display = (answer.style.display === "block") ? "none" : "block";
