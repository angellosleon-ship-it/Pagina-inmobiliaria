<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humberto León | Asesor Inmobiliario</title>

<style>

body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#0f0f0f;
    color:white;
}

/* HEADER VIDEO */
header{
    position:relative;
    height:100vh;
    overflow:hidden;
}

header video{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.header-content{
    position:relative;
    text-align:center;
    top:50%;
    transform:translateY(-50%);
}

.header-content img{
    width:180px;
    margin-bottom:20px;
}

.header-content h1{
    font-size:40px;
    margin:10px 0;
}

.header-content p{
    font-size:18px;
    color:#ccc;
}

/* PROYECTOS */
.proyectos{
    padding:80px 20px;
    text-align:center;
}

.proyectos h2{
    font-size:32px;
    margin-bottom:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(300px,1fr));
    gap:30px;
    max-width:1200px;
    margin:auto;
}

.proyecto-card{
    background:#1a1a1a;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
    transition:0.4s;
}

.proyecto-card:hover{
    transform:translateY(-10px);
}

.logo-proyecto{
    width:120px;
    display:block;
    margin:0 auto 15px;
}

.video-proyecto{
    width:100%;
    border-radius:15px;
}

/* BOTONES */
.botones-proyecto{
    margin-top:15px;
}

.btn{
    display:inline-block;
    padding:10px 18px;
    margin:5px;
    background:#bfa046;
    color:white;
    text-decoration:none;
    border-radius:30px;
    transition:0.3s;
}

.btn:hover{
    background:#d4af37;
}

.btn-agendar{
    display:inline-block;
    padding:10px 18px;
    margin:5px;
    background:#25D366;
    color:white;
    text-decoration:none;
    border-radius:30px;
}

footer{
    text-align:center;
    padding:30px;
    background:#000;
    color:#aaa;
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
    <video autoplay muted loop>
        <source src="header-video.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="header-content">
        <img src="hl_logo.png" alt="Logo Humberto León">
        <h1>Humberto León</h1>
        <p>Asesor Inmobiliario Premium</p>
    </div>
</header>

<!-- PROYECTOS -->
<section class="proyectos">
<h2>Proyectos Destacados</h2>

<div class="grid">

<!-- FUNDO MALABRIGO -->
<div class="proyecto-card">
    <img src="logo-fundo.png" class="logo-proyecto">
    <h3>Fundo Malabrigo</h3>

    <video controls class="video-proyecto">
        <source src="fundo-video.mp4" type="video/mp4">
    </video>

    <div class="botones-proyecto">
        <a href="fundo-video.mp4" target="_blank" class="btn">Ver Video</a>
        <a href="fotos-fundo.html" class="btn">Ver Fotos</a>
        <a href="https://wa.me/51999999999" target="_blank" class="btn-agendar">Agendar Visita</a>
    </div>
</div>

<!-- PUERTO MALABRIGO -->
<div class="proyecto-card">
    <img src="logo-puerto.png" class="logo-proyecto">
    <h3>Puerto Malabrigo</h3>

    <video controls class="video-proyecto">
        <source src="puerto-video.mp4" type="video/mp4">
    </video>

    <div class="botones-proyecto">
        <a href="puerto-video.mp4" target="_blank" class="btn">Ver Video</a>
        <a href="fotos-puerto.html" class="btn">Ver Fotos</a>
        <a href="https://wa.me/51999999999" target="_blank" class="btn-agendar">Agendar Visita</a>
    </div>
</div>

<!-- MONTE VERDE -->
<div class="proyecto-card">
    <img src="logo-monte.png" class="logo-proyecto">
    <h3>Monte Verde</h3>

    <video controls class="video-proyecto">
        <source src="monte-video.mp4" type="video/mp4">
    </video>

    <div class="botones-proyecto">
        <a href="monte-video.mp4" target="_blank" class="btn">Ver Video</a>
        <a href="fotos-monte.html" class="btn">Ver Fotos</a>
        <a href="https://wa.me/51999999999" target="_blank" class="btn-agendar">Agendar Visita</a>
    </div>
</div>

</div>
</section>

<footer>
© 2026 Humberto León | Todos los derechos reservados
</footer>

</body>
</html>
