<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humberto León | Asesor Inmobiliario</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#0f172a;
    color:white;
}

/* HEADER */
header{
    position:relative;
    height:100vh;
    overflow:hidden;
}

header video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);
}

.header-content{
    position:relative;
    text-align:center;
    top:50%;
    transform:translateY(-50%);
    animation:fadeIn 2s ease-in-out;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(-40%);}
    to{opacity:1; transform:translateY(-50%);}
}

.header-content img{
    width:180px;
    margin-bottom:20px;
}

/* PROYECTOS */
.proyectos{
    padding:100px 20px;
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(320px,1fr));
    gap:40px;
    max-width:1200px;
    margin:auto;
}

.proyecto-card{
    background:#111827;
    border-radius:25px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,0.6);
    transition:0.3s;
}

.proyecto-card:hover{
    transform:translateY(-10px);
}

.logo-proyecto{
    width:130px;
    margin:0 auto 15px;
    display:block;
}

.video-proyecto{
    width:100%;
    border-radius:15px;
}

.botones-proyecto{
    margin-top:15px;
}

.btn{
    display:inline-block;
    padding:10px 18px;
    margin:5px;
    background:#bfa046;
    color:white;
    text-decoration:none;
    border-radius:30px;
    transition:0.3s;
}

.btn:hover{
    background:#d4b75a;
}

.btn-agendar{
    background:#25D366;
}

/* FORMULARIO PREMIUM */
.cuestionario{
    background:linear-gradient(135deg,#0b1220,#111827);
    padding:100px 20px;
    text-align:center;
}

.cuestionario h2{
    margin-bottom:40px;
    font-size:32px;
}

.form-box{
    max-width:600px;
    margin:auto;
    background:#1f2937;
    padding:40px;
    border-radius:25px;
    box-shadow:0 15px 60px rgba(0,0,0,0.7);
}

form{
    display:flex;
    flex-direction:column;
    gap:18px;
}

input, select, textarea{
    padding:14px;
    border-radius:12px;
    border:none;
    font-size:16px;
}

textarea{
    resize:none;
    height:100px;
}

button{
    padding:15px;
    background:#bfa046;
    color:white;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    background:#d4b75a;
}

.mensaje-exito{
    margin-top:20px;
    color:#25D366;
    font-weight:bold;
    display:none;
}

footer{
    text-align:center;
    padding:30px;
    background:#000;
    color:#aaa;
}
</style>
</head>

<body>

<header>
    <video autoplay muted loop>
        <source src="header-video.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="header-content">
        <img src="hl_logo.png">
        <h1>Humberto León</h1>
        <p>Asesor Inmobiliario</p>
        <p>Proyectos exclusivos con alta valorización</p>
    </div>
</header>

<section class="proyectos">
<h2>Proyectos Destacados</h2>
<div class="grid">
    <!-- Mantén aquí tus proyectos igual como los tienes -->
</div>
</section>

<section class="cuestionario">
<h2>Agenda tu Visita o Solicita Información</h2>

<div class="form-box">
<form id="formulario">
    <input type="text" id="nombre" placeholder="Nombre completo" required>
    <input type="tel" id="telefono" placeholder="Número de celular" required>

    <select id="proyecto" required>
        <option value="">Selecciona un proyecto</option>
        <option>Fundo Malabrigo</option>
        <option>Puerto Mar Club</option>
        <option>Residencial Monte Verde</option>
    </select>

    <textarea id="mensaje" placeholder="Escribe tu consulta"></textarea>

    <button type="submit">Enviar por WhatsApp</button>
</form>

<div class="mensaje-exito" id="exito">
Mensaje listo. Redirigiendo a WhatsApp...
</div>

</div>
</section>

<footer>
© 2026 Humberto León | Asesor Inmobiliario
</footer>

<script>
document.getElementById("formulario").addEventListener("submit", function(e){
e.preventDefault();

let nombre = document.getElementById("nombre").value;
let telefono = document.getElementById("telefono").value;
let proyecto = document.getElementById("proyecto").value;
let mensaje = document.getElementById("mensaje").value;

let texto = `Hola Humberto, quiero información.%0A%0A` +
`Nombre: ${nombre}%0A` +
`Teléfono: ${telefono}%0A` +
`Proyecto: ${proyecto}%0A` +
`Mensaje: ${mensaje}`;

document.getElementById("exito").style.display="block";

setTimeout(()=>{
window.open(`https://wa.me/51985877256?text=${texto}`, "_blank");
},1000);

});
</script>

</body>
</html>
