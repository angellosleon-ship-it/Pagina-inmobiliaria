<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
:root {
    --dorado: #bfa046;
    --dorado-brillante: #ffcc33;
    --oscuro-deep: #020617;
    --oscuro-card: linear-gradient(145deg, #1e293b, #0f172a);
    --verde-wa: #25D366;
    --texto-suave: #f1f5f9;
}
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: var(--oscuro-deep);
    color: white;
    scroll-behavior: smooth;
}
header {
    position: relative;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}
header video {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover; z-index: -1;
}
.overlay {
    position: absolute;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
}
.header-content {
    position: relative;
    text-align: center;
    animation: fadeIn 2s ease;
}
.logo-personal {
    width: 240px;
    filter: drop-shadow(0 0 20px rgba(191, 160, 70, 0.6));
    margin-bottom: 10px;
}
.header-content h1 {
    font-size: clamp(40px, 8vw, 64px);
    margin: 0;
    background: linear-gradient(45deg,#bfa046,#fff,#bfa046);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.header-content p {
    font-size: 1.2rem;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-weight: 700;
    background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s infinite linear;
}

/* SECCIÓN PROYECTOS */
.proyectos { padding: 80px 20px; text-align: center; }
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 40px;
    max-width: 1250px;
    margin: auto;
}
.proyecto-card {
    background: var(--oscuro-card);
    border: 1px solid rgba(191, 160, 70, 0.3);
    border-radius: 30px;
    padding: 35px;
    transition: 0.5s all ease;
}

/* CAMBIO SOLICITADO: Subtítulos en dorado */
.tag-plusvalia {
    background: transparent;
    color: var(--dorado-brillante); /* Color dorado */
    font-size: 14px;
    font-weight: 900;
    padding: 6px 18px;
    margin-bottom: 10px;
    display: inline-block;
    text-transform: uppercase;
    letter-spacing: 2px;
}
.ubicacion-tag {
    color: var(--dorado-brillante); /* Color dorado */
    font-weight: 800;
    font-size: 1.1rem;
    margin-top: 15px;
    margin-bottom: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.logo-proyecto { width: 150px; margin: 0 auto 10px; display: block; }

/* CAMBIO SOLICITADO: Botón Clientes Felices más vistoso */
.btn-clientes-pro {
    background: linear-gradient(45deg, #bfa046, #ffcc33, #bfa046);
    background-size: 200% auto;
    border: none;
    border-radius: 50px;
    padding: 20px 50px;
    color: #000;
    font-weight: 900;
    font-size: 1.4rem;
    cursor: pointer;
    transition: 0.5s;
    box-shadow: 0 10px 30px rgba(255, 204, 51, 0.4);
    animation: pulse-gold 2s infinite;
    text-transform: uppercase;
}
.btn-clientes-pro:hover {
    background-position: right center;
    transform: scale(1.05);
    box-shadow: 0 15px 40px rgba(255, 204, 51, 0.6);
}

@keyframes pulse-gold {
    0% { box-shadow: 0 0 0 0 rgba(255, 204, 51, 0.7); }
    70% { box-shadow: 0 0 0 20px rgba(255, 204, 51, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 204, 51, 0); }
}

.btn {
    display: inline-block;
    padding: 12px 20px;
    margin: 6px;
    background: linear-gradient(to bottom, #bfa046, #8a6d1d);
    color: white;
    text-decoration: none;
    border-radius: 50px;
    font-weight: 800;
    cursor: pointer;
    border: none;
}
.btn-agendar { background: linear-gradient(to bottom, #25D366, #128C7E); }
.video-container iframe { width: 100%; height: 350px; border-radius: 20px; margin-top: 15px; }

.wa-float { position: fixed; bottom: 30px; right: 30px; background: var(--verde-wa); width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 1000; box-shadow: 0 8px 25px rgba(37, 211, 102, 0.5); }
.cta-float { position: fixed; bottom: 110px; right: 30px; background: var(--dorado); color: #000; border: none; border-radius: 50px; padding: 12px 20px; font-weight: bold; box-shadow: 0 4px 15px rgba(191,160,70,0.5); z-index: 999; cursor: pointer; }

/* LIGHTBOX */
#lightbox { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); justify-content:center; align-items:center; z-index:2000; flex-direction:column; }
#lightbox-img { max-width:90%; max-height:80%; border-radius:20px; }

@keyframes shine { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.4); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<body>

<a href="https://wa.me/51985877256" class="wa-float" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="38" alt="WhatsApp">
</a>

<button class="cta-float" onclick="window.open('https://wa.me/51985877256?text=Hola%20Humberto,%20quiero%20información%20urgente','_blank')">
    ¡Habla YA conmigo!
</button>

<header>
    <video autoplay muted loop playsinline>
        <source src="header-video.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
    <div class="header-content">
        <img src="hl_logo.png" class="logo-personal">
        <h1>Humberto León</h1>
        <p>Asesoría Inmobiliaria Transparente</p>
    </div>
</header>

<section class="proyectos">
    <div class="grid">
        <div class="proyecto-card">
            <span class="tag-plusvalia">Campo & Mar</span>
            <img src="logo-fundo.png" class="logo-proyecto">
            <h3>FUNDO MALABRIGO</h3>
            <p class="ubicacion-tag">📍 PUERTO MALABRIGO</p>
            <p>Lotes exclusivos para tu próxima casa de campo.</p>
            <div class="botones-proyecto">
                <button class="btn" onclick="abrirImagenes(['fundo1.jpg','fundo2.jpg'])">FOTOS</button>
                <button class="btn" onclick="mostrarVideos('fundo-v', ['1UrsaiKqm_dyl1F8qtVkwD9UH7_QnxfoU'])">VIDEOS</button>
                <a href="https://wa.me/51985877256" class="btn btn-agendar">AGENDAR</a>
            </div>
            <div id="fundo-v" class="video-container"></div>
        </div>

        <div class="proyecto-card">
            <span class="tag-plusvalia">Frente al Mar</span>
            <img src="logo-puerto.png" class="logo-proyecto">
            <h3>PUERTO MAR CLUB</h3>
            <p class="ubicacion-tag">📍 PUERTO MALABRIGO</p>
            <p>Tu propiedad frente al mar con exclusividad.</p>
            <div class="botones-proyecto">
                <button class="btn" onclick="abrirImagenes(['puerto1.jpg','puerto2.jpg'])">FOTOS</button>
                <button class="btn" onclick="mostrarVideos('puerto-v', ['1KmYsCcxL0D57Nb_zq9yJ1OWgnL0RL9uE'])">VIDEOS</button>
                <a href="https://wa.me/51985877256" class="btn btn-agendar">AGENDAR</a>
            </div>
            <div id="puerto-v" class="video-container"></div>
        </div>
    </div>
</section>

<section style="text-align:center; padding:80px 20px;">
    <h2 style="color:white; margin-bottom:30px;">NUESTRO RESPALDO</h2>
    <button class="btn-clientes-pro" onclick="abrirImagenes(['cliente1.jpg','cliente2.jpg','cliente3.jpg'])">🤝 CLIENTES FELICES</button>
</section>

<div id="lightbox">
    <img id="lightbox-img" src="">
    <div style="margin-top:25px">
        <button class="btn" onclick="cambiarImg(-1)">ANTERIOR</button>
        <button class="btn" onclick="cambiarImg(1)">SIGUIENTE</button>
        <button class="btn" style="background:#ff4d4d" onclick="document.getElementById('lightbox').style.display='none'">CERRAR</button>
    </div>
</div>

<script>
let lbImgs = [];
let cIdx = 0;

function abrirImagenes(imgs){
    lbImgs = imgs;
    cIdx = 0;
    document.getElementById("lightbox-img").src = lbImgs[0];
    document.getElementById("lightbox").style.display = "flex";
}

function cambiarImg(d){
    if(lbImgs.length === 0) return;
    cIdx = (cIdx + d + lbImgs.length) % lbImgs.length;
    document.getElementById("lightbox-img").src = lbImgs[cIdx];
}

function mostrarVideos(id, ids){
    const c = document.getElementById(id);
    if(c.innerHTML !== "") { c.innerHTML = ""; return; }
    ids.forEach(i => {
        let f = document.createElement("iframe");
        f.src = `https://drive.google.com/file/d/${i}/preview`;
        f.width = "100%"; f.height = "350"; f.frameBorder = "0"; f.allow = "autoplay"; f.allowFullscreen = true;
        c.appendChild(f);
    });
}
</script>

</body>
</html>
